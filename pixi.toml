[workspace]
name = "nanovitok"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Default environment: code development and CPU unit tests. Training runs on Kaggle (see kaggle/).
# The `gpu` environment only evaluates finished checkpoints on the local GPU (vitok.eval_checkpoints).

[dependencies]
python = "3.12.*"
pytorch = { version = ">=2.9", build = "cpu*" }
numpy = "*"
pyarrow = "*"
tokenizers = "*"
huggingface_hub = "*"
filelock = "*"
psutil = "*"
pytest = "*"
ipykernel = ">=7.3.0,<8"
matplotlib = ">=3.11.1,<4"

[pypi-dependencies]
tiktoken = "*"
rustbpe = "*"
vitok = { path = ".", editable = true }
underthesea = ">=9.5.0, <10"

[tasks]
test = "pytest -q tests"

# Local GPU evaluation: CUDA PyTorch from PyPI instead of the CPU build, so it cannot share the default feature.
[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.dependencies]
python = "3.12.*"
numpy = "*"
pyarrow = "*"
tokenizers = "*"
huggingface_hub = "*"
filelock = "*"
psutil = "*"

[feature.gpu.pypi-dependencies]
torch = ">=2.14.0, <3"
tiktoken = "*"
rustbpe = "*"
vitok = { path = ".", editable = true }

[environments]
gpu = { features = ["gpu"], no-default-feature = true }
