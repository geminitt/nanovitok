[workspace]
name = "vitok"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Local environment is for code development and CPU unit tests ONLY.
# All tokenizer training, pretraining and evaluation run on Kaggle (see kaggle/).

[dependencies]
python = "3.12.*"
pytorch = { version = ">=2.9", build = "cpu*" }
numpy = "*"
pyarrow = "*"
tokenizers = "*"
huggingface_hub = "*"
filelock = "*"
psutil = "*"
pytest = "*"
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
tiktoken = "*"
rustbpe = "*"
vitok = { path = ".", editable = true }

[tasks]
test = "pytest -q tests"
