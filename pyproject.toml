[project]
name = "vitok"
version = "0.1.0"
description = "Adapting an LLM with Vietnamese multi-syllable tokens"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mutmut]
source_paths = ["src/vitok/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]

# Lint and type-check scope (owner, 2026-10-08): the modules the retrofit study runs or reuses, and their tests.
# The frozen Part 1 modules (kaggle_run, train_tokenizers, data, conditions, eval, ...) are left as they produced the
# published results.
[tool.ruff]
line-length = 120
target-version = "py312"
include = [
    "src/vitok/retrofit.py", "src/vitok/superbpe.py", "src/vitok/stats.py", "src/vitok/text.py",
    "src/vitok/hf_tokenizer.py", "src/vitok/tokenizer_spec.py", "src/vitok/compression.py", "src/vitok/analysis.py",
    "tests/conftest.py", "tests/test_retrofit.py", "tests/test_superbpe.py", "tests/test_conditions_stats.py",
    "tests/test_analysis.py", "tests/test_tokenizers.py", "tests/test_text.py", "tests/test_input_contracts.py",
    "src/vitok/extend.py", "src/vitok/cpt_data.py", "src/vitok/adapt.py", "src/vitok/score.py", "src/vitok/compare.py",
    "src/vitok/heldout.py", "src/vitok/pipeline.py", "src/vitok/kaggle_session.py",
    "tests/test_extend.py", "tests/test_cpt_data.py", "tests/test_adapt.py", "tests/test_score.py", "tests/test_heldout.py",
    "tests/test_pipeline.py", "tests/test_kaggle_session.py", "tests/test_notebook03.py", "tests/test_notebook04.py",
    "src/vitok/report.py", "tests/test_report.py", "src/vitok/survey.py", "tests/test_survey.py",
    "tests/test_pilot_cleanup.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# assigned lambdas are this codebase's idiom for one-line helpers
ignore = ["E731"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src:tests"
files = [
    "src/vitok/retrofit.py", "src/vitok/superbpe.py", "src/vitok/stats.py", "src/vitok/text.py",
    "src/vitok/hf_tokenizer.py", "src/vitok/tokenizer_spec.py", "src/vitok/compression.py", "src/vitok/analysis.py",
    "src/vitok/extend.py", "src/vitok/cpt_data.py", "src/vitok/adapt.py", "src/vitok/score.py", "src/vitok/compare.py",
    "src/vitok/heldout.py", "src/vitok/pipeline.py", "src/vitok/kaggle_session.py",
    "src/vitok/report.py",
    "src/vitok/survey.py",
]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
