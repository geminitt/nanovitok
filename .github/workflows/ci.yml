name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dev environment (default + ruff, mypy, pytest-cov, mutmut; CPU PyTorch). The gpu environment is
      # for scoring checkpoints on a local GPU and is not needed to test or to redo the analysis.
      - name: Install pixi and the dev environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.79.0
          environments: dev
          cache: true

      # nanochat at the pinned commit with the project's patch; the integration tests import it.
      - name: Recreate third_party/nanochat
        run: |
          git clone --quiet https://github.com/karpathy/nanochat third_party/nanochat
          git -C third_party/nanochat checkout --quiet "$(cat patches/NANOCHAT_COMMIT)"
          git -C third_party/nanochat apply ../../patches/nanochat.patch

      - name: Run tests
        run: pixi run -e dev test

      - name: Lint
        run: pixi run -e dev lint

      - name: Type check
        run: pixi run -e dev typecheck

      # results/summary.md is generated from the committed result files, and the analysis is
      # deterministic (seeded bootstrap): regenerating it must reproduce the committed file.
      - name: Check results/summary.md matches the recorded results
        run: |
          pixi run -e dev python -m vitok.analysis --results kaggle/outputs \
            --compression kaggle/outputs/vitok-data/compression-16k.json \
            --val-results results/val \
            --out /tmp/summary.md --figures /tmp/figures > /dev/null
          diff <(grep -v '^Figure' /tmp/summary.md) <(grep -v '^Figure' results/summary.md)
          pixi run -e dev python -c "import numpy as np; from matplotlib.image import imread; assert np.array_equal(imread('/tmp/figures/h3_scaling.png'), imread('figures/h3_scaling.png'))"

      - name: Check the retrofit report matches item-level measurements
        run: |
          pixi run -e dev python -m vitok.report --data results/adaptation --out /tmp/adaptation.md --readme /tmp/README.md --figures /tmp/adaptation-figures
          diff /tmp/adaptation.md results/adaptation.md
          diff /tmp/README.md README.md
          for figure in recovery quality_cost generation; do
            cmp "/tmp/adaptation-figures/$figure.png" "figures/$figure.png"
          done

      - name: Remeasure the retained survey from pinned tokenizer files
        run: |
          pixi run -e dev python -m vitok.survey --recorded results/adaptation/tokenizers/survey.json \
            --docs-root kaggle/outputs/vitok-data --out /tmp/tokenizer-survey.json
          cmp /tmp/tokenizer-survey.json results/adaptation/tokenizers/survey.json
